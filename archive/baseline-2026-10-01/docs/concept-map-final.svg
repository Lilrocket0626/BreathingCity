<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07122e"/>
      <stop offset="1" stop-color="#123e57"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8ecae6"/></marker>
    <style>
      .node { fill:#f3fbff; stroke:#56b4d3; stroke-width:4; }
      .process { fill:#dff6f2; stroke:#34a89b; stroke-width:4; }
      .core { fill:#ffd166; stroke:#f5a623; stroke-width:5; }
      .label { font-family:Arial,sans-serif; font-size:25px; font-weight:700; fill:#10283a; text-anchor:middle; dominant-baseline:middle; }
      .small { font-family:Arial,sans-serif; font-size:18px; fill:#365568; text-anchor:middle; }
      .line { stroke:#8ecae6; stroke-width:4; fill:none; marker-end:url(#arrow); }
      .link { stroke:#5b9bb6; stroke-width:3; fill:none; stroke-dasharray:10 10; }
      .title { font-family:Arial,sans-serif; font-size:34px; font-weight:700; fill:#d9f2ff; }
      .subtitle { font-family:Arial,sans-serif; font-size:21px; fill:#b9dbea; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="70" y="62" class="title">FINAL CONCEPT MAP - BREATHING CITY</text>
  <text x="70" y="100" class="subtitle">Expanded understanding of input, data, state, objects, testing and creative output</text>

  <path class="line" d="M800 250 L800 330"/>
  <path class="line" d="M650 420 C500 410 430 330 380 250"/>
  <path class="line" d="M650 470 C500 500 430 500 380 500"/>
  <path class="line" d="M650 520 C505 600 440 700 380 750"/>
  <path class="line" d="M950 420 C1100 410 1170 330 1220 250"/>
  <path class="line" d="M950 470 C1100 500 1170 500 1220 500"/>
  <path class="line" d="M950 520 C1095 600 1160 700 1220 750"/>
  <path class="line" d="M800 560 L800 710"/>
  <path class="link" d="M380 250 C510 140 1090 140 1220 250"/>
  <path class="link" d="M380 750 C560 900 1040 900 1220 750"/>

  <rect class="process" x="610" y="135" width="380" height="115" rx="28"/>
  <text class="label" x="800" y="177">TRACEABLE DATA PIPELINE</text>
  <text class="small" x="800" y="214">input → calibrate → map → smooth → respond</text>

  <rect class="core" x="640" y="330" width="320" height="230" rx="42"/>
  <text class="label" x="800" y="410">BREATHING CITY</text>
  <text class="small" x="800" y="450">breath becomes a shared</text>
  <text class="small" x="800" y="477">0.0-1.0 intensity value</text>
  <text class="small" x="800" y="515">continuous control + events</text>

  <rect class="node" x="90" y="165" width="390" height="170" rx="30"/>
  <text class="label" x="285" y="215">INPUT AND CALIBRATION</text>
  <text class="small" x="285" y="257">AudioIn + Amplitude</text>
  <text class="small" x="285" y="287">3-second room-noise floor</text>

  <rect class="node" x="70" y="415" width="410" height="170" rx="30"/>
  <text class="label" x="275" y="465">DATA INTERPRETATION</text>
  <text class="small" x="275" y="507">subtract, map, constrain</text>
  <text class="small" x="275" y="537">attack/release smoothing</text>

  <rect class="node" x="90" y="665" width="390" height="170" rx="30"/>
  <text class="label" x="285" y="715">STATE AND EVENTS</text>
  <text class="small" x="285" y="757">threshold crossing + cooldown</text>
  <text class="small" x="285" y="787">previous value enables memory</text>

  <rect class="node" x="1120" y="165" width="390" height="170" rx="30"/>
  <text class="label" x="1315" y="215">GENERATIVE VISUALS</text>
  <text class="small" x="1315" y="257">sky, windows, harbour</text>
  <text class="small" x="1315" y="287">particles + expanding rings</text>

  <rect class="node" x="1120" y="415" width="410" height="170" rx="30"/>
  <text class="label" x="1325" y="465">OBJECT ORGANISATION</text>
  <text class="small" x="1325" y="507">classes store state + behaviour</text>
  <text class="small" x="1325" y="537">arrays and ArrayLists manage many</text>

  <rect class="node" x="1120" y="665" width="390" height="170" rx="30"/>
  <text class="label" x="1315" y="715">TESTING AND RESILIENCE</text>
  <text class="small" x="1315" y="757">live graph + fixed limits</text>
  <text class="small" x="1315" y="787">mouse fallback + Git versions</text>

  <rect class="process" x="535" y="710" width="530" height="150" rx="32"/>
  <text class="label" x="800" y="755">DEVELOPING CODE LITERACY</text>
  <text class="small" x="800" y="798">code is not only output: it is a system of</text>
  <text class="small" x="800" y="827">data choices, state, feedback and revision</text>
</svg>
