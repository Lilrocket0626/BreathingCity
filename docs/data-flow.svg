<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d94a6"/></marker></defs>
<rect width="1600" height="920" fill="#0c1927"/>
<style>text{font-family:Arial,sans-serif} .title{font-size:38px;font-weight:700;fill:#f5f3ea}.sub{font-size:19px;fill:#a6bdc9}.head{font-size:23px;font-weight:700;fill:#eef4f2}.body{font-size:20px;fill:#b8ccd4}.small{font-size:18px;fill:#a6bdc9}</style>
<text x="65" y="66" class="title">DATA FLOW / From sound to Sydney</text>
<text x="65" y="108" class="sub">On screen: raw level, floor and energy. In telemetry: raw level, threshold, target and energy.</text>
<rect x="65" y="155" width="420" height="175" rx="14" fill="#152b3b" stroke="#2c4859"/>
<rect x="65" y="155" width="5" height="175" rx="2" fill="#6ddacb"/>
<text x="88" y="194" class="head">A  AUDIO INPUT</text>
<text x="88" y="230" class="body">Sound selects input device</text>
<text x="88" y="259" class="body">AudioIn(channel 0).start()</text>
<text x="88" y="288" class="body">Amplitude.analyze() → RMS</text>
<rect x="560" y="155" width="475" height="175" rx="14" fill="#152b3b" stroke="#2c4859"/>
<rect x="560" y="155" width="5" height="175" rx="2" fill="#6ddacb"/>
<text x="583" y="194" class="head">B  CALIBRATION</text>
<text x="583" y="230" class="body">Quiet readings for ~3 seconds</text>
<text x="583" y="259" class="body">90th percentile → noiseFloor</text>
<text x="583" y="288" class="body">Margin tunes noise rejection</text>
<rect x="1110" y="155" width="425" height="175" rx="14" fill="#152b3b" stroke="#2c4859"/>
<rect x="1110" y="155" width="5" height="175" rx="2" fill="#6ddacb"/>
<text x="1133" y="194" class="head">C  HYSTERESIS</text>
<text x="1133" y="230" class="body">Open: floor + margin</text>
<text x="1133" y="259" class="body">Close: floor + 0.55 × margin</text>
<text x="1133" y="288" class="body">Gate remembers its state</text>
<polyline points="485,242 553,242" fill="none" stroke="#6d94a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="1035,242 1103,242" fill="none" stroke="#6d94a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1110" y="435" width="425" height="208" rx="14" fill="#152b3b" stroke="#2c4859"/>
<rect x="1110" y="435" width="5" height="208" rx="2" fill="#6ddacb"/>
<text x="1133" y="474" class="head">D  NORMALISATION</text>
<text x="1133" y="510" class="body">Subtract opening threshold</text>
<text x="1133" y="539" class="body">Multiply sensitivity; divide .06</text>
<text x="1133" y="568" class="body">Clamp target to [0,1]</text>
<text x="1133" y="597" class="body">Gate closed → target zero</text>
<rect x="560" y="435" width="475" height="208" rx="14" fill="#152b3b" stroke="#2c4859"/>
<rect x="560" y="435" width="5" height="208" rx="2" fill="#6ddacb"/>
<text x="583" y="474" class="head">E  SMOOTHING</text>
<text x="583" y="510" class="body">alpha = 1 - exp(-dt / tau)</text>
<text x="583" y="539" class="body">energy += alpha × (target-energy)</text>
<text x="583" y="568" class="body">Attack tau .10 s; release .55 s</text>
<text x="583" y="597" class="body">Near-zero residue → zero</text>
<rect x="65" y="435" width="420" height="208" rx="14" fill="#152b3b" stroke="#2c4859"/>
<rect x="65" y="435" width="5" height="208" rx="2" fill="#6ddacb"/>
<text x="88" y="474" class="head">F  VISUAL SYSTEMS</text>
<text x="88" y="510" class="body">Landmark/window/sky colours</text>
<text x="88" y="539" class="body">Integrated wave phase + height</text>
<text x="88" y="568" class="body">Particle emission and speed</text>
<text x="88" y="597" class="body">Ripple peak and lifecycle</text>
<polyline points="1322,330 1322,428" fill="none" stroke="#6d94a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="1110,537 1042,537" fill="none" stroke="#6d94a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="560,537 492,537" fill="none" stroke="#6d94a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="65" y="710" width="1470" height="106" rx="14" fill="#152b3b" stroke="#2c4859"/>
<rect x="65" y="710" width="5" height="106" rx="2" fill="#efb982"/>
<text x="88" y="749" class="head">BOUNDARIES</text>
<text x="88" y="785" class="body">RMS is a loudness proxy, not dB SPL or breath classification. Synthetic input validates software only.</text>
<text x="65" y="874" class="small">Source: final BreathInput.pde, SignalEnvelope.java, CityScene.pde and VisualEffects.pde. Created 1 October 2026.</text>
</svg>